env:
  NODE_ENV: staging
  # Backend API URL for frontend to connect to backend health check - get <service-name> using kubectl get services
  NEXT_PUBLIC_BACKEND_URL: http://hybrid-fhir-odl-backend-web-app:80  # or http://localhost:8000 if multicontainer pod is setup and backend is running on 8000
  NEXT_PUBLIC_ENABLE_FHIR: "true"

## Single Pod Containers
envSecrets:
  # MongoDB Configuration
  MONGODB_URI: hybrid-fhir-odl-secret
  MONGODB_DB: hybrid-fhir-odl-secret  
  MONGODB_COLLECTION: hybrid-fhir-odl-secret 
  MONGODB_TENANT: hybrid-fhir-odl-secret

