services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hybrid_odl_backend
    ports:
      - "3100:3100"
    volumes:
      - ./backend:/app
    environment:
      - PORT=3100
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hybrid_odl_frontend
    ports:
      - "3101:3101"
    depends_on:
      - backend
    restart: always